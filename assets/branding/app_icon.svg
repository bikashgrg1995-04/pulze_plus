<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#eceef1"/>
      <stop offset="55%" stop-color="#d7d9de"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Disc built from brand tokens: Primary Container -> Primary -> darker Primary -->
    <radialGradient id="disc" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F26A6A"/>
      <stop offset="35%" stop-color="#D32F2F"/>
      <stop offset="75%" stop-color="#9E2222"/>
      <stop offset="100%" stop-color="#6E1616"/>
    </radialGradient>

    <linearGradient id="gloss" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dropGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFEBEE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFEBEE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dropStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FFEBEE"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <circle cx="512" cy="512" r="500" fill="url(#bezel)"/>
    <circle cx="512" cy="512" r="462" fill="url(#disc)"/>
  </g>

  <!-- Radar rings + nodes in the Secondary blue-grey token, for a clinical/tech contrast against the red -->
  <circle cx="512" cy="512" r="400" fill="none" stroke="#455A64" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#455A64" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2 10"/>

  <g fill="#B0BEC5">
    <circle cx="512" cy="112" r="6" opacity="0.9"/>
    <circle cx="801" cy="223" r="5" opacity="0.75"/>
    <circle cx="912" cy="512" r="6" opacity="0.9"/>
    <circle cx="801" cy="801" r="5" opacity="0.75"/>
    <circle cx="512" cy="912" r="6" opacity="0.9"/>
    <circle cx="223" cy="801" r="5" opacity="0.75"/>
    <circle cx="112" cy="512" r="6" opacity="0.9"/>
    <circle cx="223" cy="223" r="5" opacity="0.75"/>
  </g>

  <path d="M512 512 L512 112 A400 400 0 0 1 801 223 Z" fill="#455A64" opacity="0.10"/>

  <circle cx="512" cy="512" r="462" fill="url(#gloss)"/>

  <circle cx="512" cy="540" r="260" fill="url(#dropGlow)"/>

  <!-- Blood drop -->
  <path d="M512 260
           C512 260 372 470 372 590
           C372 683 434 748 512 748
           C590 748 652 683 652 590
           C652 470 512 260 512 260 Z"
        fill="none" stroke="url(#dropStroke)" stroke-width="20" stroke-linejoin="round" filter="url(#pulseGlow)"/>

  <!-- Heartbeat / pulse line, kept clean white -->
  <path d="M400 592 L468 592 L500 500 L540 680 L572 592 L624 592"
        fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#pulseGlow)"/>
</svg>
